[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanmu-ordering"
version = "0.1.0"
description = "自己写的三木点餐系统，Python + SQLite Windows 桌面点餐收银工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sanmu-ordering = "sanmu.__main__:main"

[tool.setuptools.packages.find]
include = ["sanmu*"]
